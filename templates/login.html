<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SmartNotes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        📚 SmartNotes
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/register">
            Register
        </a>

    </div>

</nav>


<!-- ================= LOGIN SECTION ================= -->

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to SmartNotes
        </p>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <!-- Login Form -->

        <form method="POST">

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <!-- Register Link -->

        <p class="auth-bottom">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</section>


</body>

</html>
