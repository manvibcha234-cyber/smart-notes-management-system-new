<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration - SmartNotes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<!-- Navbar -->

<nav class="navbar">

    <div class="logo">
        📚 SmartNotes
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/login">
            Login
        </a>

    </div>

</nav>


<!-- Registration -->

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">
            🎓
        </div>

        <h1>
            Student Registration
        </h1>

        <p class="auth-subtitle">
            Create your SmartNotes account
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                minlength="8"
                required
            >


            <button type="submit"
                    class="auth-button">

                Create Account

            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</section>


</body>

</html>
